name: Sync and Obfuscate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '明文源吗'

permissions:
  contents: write

jobs:
  sync-and-obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Obfuscator
        run: npm install javascript-obfuscator@5.9.0

      - name: Download and overwrite files
        run: |
          curl -fsSL --max-time 60 "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97" -o "明文源吗"

      - name: Obfuscate from local source file
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs');
          const path = require('path');

          const sourceFileName = '明文源吗';
          const outputFileName = '_worker.js';
          const sourceFilePath = path.join(process.cwd(), sourceFileName);

          if (!fs.existsSync(sourceFilePath)) {
            console.error('错误：在路径 \'' + sourceFilePath + '\' 未找到源文件。');
            process.exit(1);
          }

          const originalCode = fs.readFileSync(sourceFilePath, 'utf8');

          if (!originalCode || originalCode.trim().length === 0) {
            console.error('错误：源文件 ' + sourceFileName + ' 为空。');
            process.exit(1);
          }

          // 针对 Cloudflare Workers 的实测约束（勿随意放开）：
          //   1. deadCodeInjection: true 会让 wrangler/esbuild 打包直接失败
          //      （Build failed: Cannot assign to "X" because it is a constant）。
          //   2. selfDefending: true 会被 Workers 运行时的二次压缩破坏完整性自校验，
          //      表现为 worker 启动后挂死、请求永不返回。
          //   其余强度参数已按实测结果提高：控制流平坦化 0.5、字符串数组包装 3 层并链式调用、
          //   数字转表达式、simplify 等。
          const obfuscationOptions = {
            compact: true,
            controlFlowFlattening: true,
            controlFlowFlatteningThreshold: 0.5,
            deadCodeInjection: false,
            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayThreshold: 1.0,
            stringArrayRotate: true,
            stringArrayShuffle: true,
            stringArrayWrappersCount: 3,
            stringArrayWrappersChainedCalls: true,
            stringArrayWrappersParametersMaxCount: 4,
            renameGlobals: false,
            identifierNamesGenerator: 'mangled-shuffled',
            ignoreImports: true,
            target: 'browser-no-eval',
            numbersToExpressions: true,
            simplify: true,
            splitStrings: true,
            splitStringsChunkLength: 3,
            transformObjectKeys: true,
            unicodeEscapeSequence: true,
            selfDefending: false,
            debugProtection: false,
            debugProtectionInterval: 0,
            disableConsoleOutput: false,
            domainLock: []
          };

          try {
            console.log('开始混淆...');
            const obfuscatedCode = JavaScriptObfuscator.obfuscate(originalCode, obfuscationOptions).getObfuscatedCode();

            // 产物自检：_worker.js 必须仍是合法 ESM 入口，否则宁可不提交。
            if (!obfuscatedCode.includes('export default')) {
              console.error('错误：混淆产物缺少 "export default"，疑似被破坏，已中止。');
              process.exit(1);
            }

            fs.writeFileSync(path.join(process.cwd(), outputFileName), obfuscatedCode, 'utf8');
            const originalSize = Buffer.byteLength(originalCode, 'utf8');
            const obfuscatedSize = Buffer.byteLength(obfuscatedCode, 'utf8');
            console.log('原始大小: ' + (originalSize / 1024).toFixed(2) + ' KB');
            console.log('混淆后大小: ' + (obfuscatedSize / 1024).toFixed(2) + ' KB');
            console.log('膨胀率: ' + ((obfuscatedSize / originalSize) * 100).toFixed(1) + '%');
            console.log('完成：\'' + sourceFileName + '\' → \'' + outputFileName + '\'');
          } catch (err) {
            console.error('混淆失败：' + err.message);
            console.error(err.stack);
            process.exit(1);
          }
          EOF
          node obfuscate.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "明文源吗" "_worker.js"
          if git diff --staged --quiet; then
            echo "No changes, skipping."
          else
            git commit -m "sync & obfuscate: update from byJoey/cfnew@main"
            git push origin main
          fi
